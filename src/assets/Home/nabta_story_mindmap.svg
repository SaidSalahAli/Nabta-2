<svg width="100%" viewBox="0 0 680 500" role="img" style="" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">قصتنا - نبته</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">مخطط ذهني يوضح من نحن ومهمتنا ورؤيتنا وسبب الاسم</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Connector lines (drawn first so boxes appear on top) -->
  <!-- top-left box to circle -->
  <path d="M 248 148 Q 290 148 310 205" fill="none" stroke="#098bc9" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(9, 139, 201);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- top-right box to circle -->
  <path d="M 432 148 Q 390 148 370 205" fill="none" stroke="#098bc9" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(9, 139, 201);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- bottom-left box to circle -->
  <path d="M 248 352 Q 290 352 310 300" fill="none" stroke="#098bc9" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(9, 139, 201);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- bottom-right box to circle -->
  <path d="M 432 352 Q 390 352 370 300" fill="none" stroke="#098bc9" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(9, 139, 201);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Center circle -->
  <circle cx="340" cy="250" r="72" fill="#098bc9" stroke="#beebfe" stroke-width="8" style="fill:rgb(9, 139, 201);stroke:rgb(190, 235, 254);color:rgb(255, 255, 255);stroke-width:8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="white" text-anchor="middle" x="340" y="243" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:26px;font-weight:800;text-anchor:middle;dominant-baseline:auto">قصتنا</text>
  <text font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" x="340" y="265" opacity="0.85" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:Arial, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">نبته</text>

  <!-- Top-left box: من نحن -->
  <rect x="40" y="60" width="208" height="176" rx="18" fill="white" stroke="#0088CC" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(0, 136, 204);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#3A3246" text-anchor="middle" x="144" y="95" style="fill:rgb(58, 50, 70);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:auto">من نحن:</text>
  <foreignObject x="52" y="104" width="184" height="120" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;color:#5B5368;line-height:1.7;direction:rtl;text-align:right;;fill:rgb(0, 0, 0);stroke:none;color:rgb(91, 83, 104);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      منصة رائدة في صناعة محتوى الأطفال التربوي والتعليمي، ودعم الأمهات والآباء من خلال: نصائح تربوية، تطبيقات تعليمية، فيديوهات توعوية، أوراق مذاكرة وتلوين.
    </div>
  </foreignObject>

  <!-- Top-right box: الرؤية المستقبلية -->
  <rect x="432" y="60" width="208" height="176" rx="18" fill="white" stroke="#0088CC" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(0, 136, 204);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#3A3246" text-anchor="middle" x="536" y="95" style="fill:rgb(58, 50, 70);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:auto">الرؤية المستقبلية:</text>
  <foreignObject x="444" y="104" width="184" height="120" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;color:#5B5368;line-height:1.7;direction:rtl;text-align:right;;fill:rgb(0, 0, 0);stroke:none;color:rgb(91, 83, 104);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      أن نُصبح مركزًا إقليميًا موثوقًا به ينافس في مجال صناعة المحتوى التربوي التعليمي للأطفال، ودعم الأمهات والآباء بمنهجية علمية وأساليب متطورة.
    </div>
  </foreignObject>

  <!-- Bottom-left box: المهمة الأساسية -->
  <rect x="40" y="264" width="208" height="176" rx="18" fill="white" stroke="#0088CC" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(0, 136, 204);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#3A3246" text-anchor="middle" x="144" y="299" style="fill:rgb(58, 50, 70);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:auto">المهمة الأساسية:</text>
  <foreignObject x="52" y="308" width="184" height="120" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;color:#5B5368;line-height:1.7;direction:rtl;text-align:right;;fill:rgb(0, 0, 0);stroke:none;color:rgb(91, 83, 104);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      اغرس بذرة.. تنبت نبته.. تحصد ثمرة. نغرس بذور المعرفة الصافية داخل أطفالنا، ونسقيها بالحب والمتابعة لتصبح نبتة جميلة وراسخة.
    </div>
  </foreignObject>

  <!-- Bottom-right box: لماذا اسم نبته -->
  <rect x="432" y="264" width="208" height="176" rx="18" fill="white" stroke="#0088CC" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(0, 136, 204);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#3A3246" text-anchor="middle" x="536" y="299" style="fill:rgb(58, 50, 70);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:auto">لماذا اسم نبته؟</text>
  <foreignObject x="444" y="308" width="184" height="120" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;color:#5B5368;line-height:1.7;direction:rtl;text-align:right;;fill:rgb(0, 0, 0);stroke:none;color:rgb(91, 83, 104);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      لأننا نؤمن بأن الأطفال مثل النباتات، كلما اعتنيت بهم وسقيتهم المعرفة السليمة، أثمروا وأزهروا نبتة طيبة ونافعة.
    </div>
  </foreignObject>
</svg>